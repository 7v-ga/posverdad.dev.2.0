[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "posverdad"
version = "0.1.0"
description = "Sistema de scraping, análisis y visualización de medios chilenos (Posverdad)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

authors = [
  { name = "Gabriel", email = "you@example.com" },
]

# Dependencias "core", compartidas por scraper, scripts, futura API, etc.
dependencies = [
  # DB
  "psycopg[binary]>=3.2,<4.0",
  "SQLAlchemy>=2.0,<3.0",

  # Config / tipos / utilidades base
  "python-dotenv>=1.0,<2.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.3,<3.0",  # añadido porque ya lo usas en settings.py
  "numpy>=2.3,<3.0",
  "pandas>=2.3,<3.0",
  "typer>=0.16,<1.0",
  "protobuf>=6.32,<7.0",
  "regex>=2025.7,<2026.0",
]

[dependency-groups]

# --- API HTTP (FastAPI) ---
api = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<1.0",
]

# --- Scraping y utilidades ---
scraper = [
  "Scrapy>=2.13,<3.0",
  "itemloaders>=1.3,<2.0",
  "lxml>=6.0,<7.0",
  "cssselect>=1.3,<2.0",
  "requests>=2.32,<3.0",
  "tldextract>=5.3,<6.0",
]

# --- NLP y análisis ---
nlp = [
  "spacy>=3.8,<3.9",
  "pysentimiento>=0.7,<1.0",
  "nltk>=3.9,<4.0",
  "transformers>=4.55,<5.0",
  "accelerate>=1.10,<2.0",
]

# --- Visualización / notebooks ---
viz = [
  "matplotlib>=3.10,<4.0",
]

notebooks = [
  "jupyter>=1.1,<2.0",
  "matplotlib>=3.10,<4.0",
]

# --- Entorno de desarrollo ---
dev = [
  "ruff>=0.6,<0.7",
  "black>=24.8,<25.0",
  "mypy>=1.10,<2.0",
  "pytest>=8.3,<9.0",
  "ipython>=8.27,<9.0",
]
ap = [
    "fastapi>=0.115.14",
]

# =====================================================================
# Herramientas (lint, formateo, tipos, tests)
# =====================================================================

[tool.black]
line-length = 88
target-version = ["py311"]
exclude = '''
/(
  \.git
  | \.venv
  | \.mypy_cache
  | \.pytest_cache
  | \.turbo
  | node_modules
  | \.next
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
  ".venv",
  "node_modules",
  ".next",
  ".turbo",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = []

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
exclude = [
  "\\.venv",
  "node_modules",
  "\\.next",
  "\\.turbo",
]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools]
packages = []
